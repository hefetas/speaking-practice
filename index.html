<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>İngilizce Speaking Pratik</title>
<style>:root {
  --bg: #fff6ec;
  --surface: #ffffff;
  --ink: #231f3d;
  --muted: #655f82;
  --line: #eadfd0;
  --indigo: #4b4fbf;
  --indigo-2: #6d4cc9;
  --coral: #ff6b57;
  --coral-soft: #ffe3dd;
  --sun: #ffc247;
  --mint: #1f9e80;
  --mint-soft: #d9f4ec;
  --warn: #7a4300;
  --warn-soft: #ffeccd;
  --shadow: 0 6px 18px rgba(75, 79, 191, .10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17142b;
    --surface: #221e3d;
    --ink: #f4f0ff;
    --muted: #b6b0d4;
    --line: #353058;
    --indigo: #8e92ff;
    --indigo-2: #a98bff;
    --coral: #ff8a78;
    --coral-soft: #4a2a33;
    --sun: #ffd070;
    --mint: #4fd1b0;
    --mint-soft: #1c3b3a;
    --warn: #ffcf8a;
    --warn-soft: #43301a;
    --shadow: 0 6px 18px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
}
#app { max-width: 600px; margin: 0 auto; padding: 14px 16px 110px; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 14px; }
.logo { font-weight: 800; font-size: 20px; letter-spacing: .2px; }
.logo-dot { display: inline-block; background: var(--indigo); border-radius: 12px; padding: 2px 6px; margin-right: 4px; }
.pill {
  background: var(--coral-soft);
  color: var(--ink);
  border-radius: 999px;
  padding: 6px 14px;
  font-weight: 700;
  min-height: 36px;
  display: flex;
  align-items: center;
}
.foot { margin-top: 26px; color: var(--muted); font-size: 13px; text-align: center; }

h1 { font-size: 28px; line-height: 1.15; margin: 4px 0 2px; font-weight: 800; }
h2 { font-size: 13px; margin: 0 0 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .8px; }
.eyebrow { color: var(--muted); font-size: 14px; margin: 0; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 14px; }

.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #6d4cc9, #3b3fa8);
  color: #fff;
  border-radius: 28px;
  padding: 22px 20px 20px;
  box-shadow: var(--shadow);
}
.hero::after {
  content: "";
  position: absolute;
  right: -46px;
  top: -46px;
  width: 124px;
  height: 124px;
  background: var(--coral);
  opacity: .9;
  border-radius: 50%;
}
.hero > * { position: relative; z-index: 1; }
.hero .eyebrow { color: #e4e1ff; max-width: 72%; }
.hero h1 { font-size: 30px; margin-top: 6px; max-width: 80%; }
.hero .emoji { font-size: 44px; display: block; margin-bottom: 6px; }
.hero .sub { color: #e4e1ff; margin-bottom: 18px; }
.btn-sun {
  width: 100%;
  background: var(--sun);
  color: #231f3d;
  border: 0;
  font-weight: 800;
  font-size: 18px;
  box-shadow: 0 5px 0 #d99a1c;
}
.btn-sun:active { transform: translateY(3px); box-shadow: 0 2px 0 #d99a1c; }

.card {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 22px;
  padding: 16px;
  margin: 14px 0;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--coral-soft); border-radius: 999px; padding: 6px 14px; font-size: 15px; font-weight: 600; }
.chip.hit { background: var(--mint-soft); }
.chip.miss { background: transparent; border: 2px dashed var(--line); color: var(--muted); }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.day { font-size: 12px; color: var(--muted); font-weight: 700; }
.dot {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  margin: 4px auto 0;
  display: grid;
  place-items: center;
  border: 2px solid var(--line);
  font-weight: 800;
  font-size: 15px;
}
.dot.done { background: var(--mint); border-color: var(--mint); color: #fff; }
.dot.today { border-color: var(--coral); border-width: 3px; }
.dot.future { opacity: .45; }

.goal { display: flex; align-items: center; gap: 16px; }
.ring { width: 84px; height: 84px; flex: none; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--coral); transition: stroke-dashoffset .5s ease; }
.ring text { fill: var(--ink); font-weight: 800; font-size: 22px; }
.goal b { font-size: 18px; display: block; }
.goal span { color: var(--muted); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
button {
  font: inherit;
  min-height: 48px;
  border-radius: 16px;
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 10px 16px;
  cursor: pointer;
  font-weight: 700;
}
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--indigo); outline-offset: 2px; }
button.on { background: var(--indigo); color: #fff; border-color: var(--indigo); }
button.primary {
  width: 100%;
  background: var(--coral);
  color: #2a0d08;
  border: 0;
  font-weight: 800;
  font-size: 18px;
  margin-top: 8px;
  box-shadow: 0 5px 0 #d94a38;
}
button.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #d94a38; }
button.ghost { background: transparent; }
.row { display: flex; gap: 10px; margin-top: 12px; }
.row > button { flex: 1; }

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 14px 0; }
.stat { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 14px; text-align: center; }
.stat b { display: block; font-size: 28px; font-weight: 800; }
.stat span { color: var(--muted); font-size: 13px; font-weight: 600; }

.prompt { font-size: 22px; line-height: 1.35; margin: 4px 0 12px; font-weight: 800; }
.hint { color: var(--muted); margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 14px; margin: 0 0 10px; font-weight: 600; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 16px; padding: 12px 14px; margin: 14px 0; font-size: 15px; font-weight: 600; }
.center { text-align: center; padding: 48px 0; }
.count { font-size: 110px; font-weight: 800; color: var(--coral); line-height: 1.1; }
.timer { font-size: 52px; font-weight: 800; text-align: center; margin: 4px 0; font-variant-numeric: tabular-nums; }
.bar { height: 14px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--coral); border-radius: 999px; transition: width .25s linear; }
.transcript, textarea {
  width: 100%;
  min-height: 150px;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  font: inherit;
  color: var(--ink);
  margin-top: 12px;
}
.transcript { white-space: pre-wrap; }
.transcript .ghost { color: var(--muted); }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.empty { color: var(--muted); margin: 0; }

.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--surface);
  border-top: 2px solid var(--line);
}
.tab { flex: 1; max-width: 220px; display: flex; flex-direction: column; align-items: center; gap: 0; min-height: 52px; padding: 4px 12px; border-radius: 16px; border: 0; background: transparent; color: var(--muted); font-size: 13px; }
.tab-ico { font-size: 20px; line-height: 1.2; }
.tab.on { background: var(--coral-soft); color: var(--ink); }
body.in-flow .tabs { display: none; }
body.in-flow #app { padding-bottom: 40px; }

.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.confetti span {
  position: absolute;
  top: -30px;
  font-size: 26px;
  animation: fall 2.6s ease-in forwards;
}
@keyframes fall {
  to { transform: translateY(105vh) rotate(360deg); opacity: .9; }
}
@media (prefers-reduced-motion: reduce) {
  .confetti { display: none; }
  .ring .fg, .bar i { transition: none; }
  button:active { transform: none; }
}
@media (max-width: 380px) {
  h1 { font-size: 24px; }
  .hero h1 { font-size: 25px; }
  .prompt { font-size: 19px; }
}

/* ---- v3 additions ---- */
.seg.two { grid-template-columns: repeat(2, 1fr); }
.rankrow { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.rankrow b { font-size: 20px; }
.rankrow span { color: var(--muted); font-weight: 700; }
.bar.slim { height: 10px; }
.bar.gold i { background: var(--sun); }
.bar.mint i { background: var(--mint); }
.bar i.static { transition: none; }
.chal-title { font-weight: 800; margin: 0 0 8px; }
.stamps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stamp { text-align: center; padding: 10px 4px; border-radius: 18px; border: 2px dashed var(--line); color: var(--muted); font-size: 13px; font-weight: 700; }
.stamp .ico { font-size: 28px; display: block; filter: grayscale(1); opacity: .4; }
.stamp.got { border: 2px solid var(--mint); background: var(--mint-soft); color: var(--ink); }
.stamp.got .ico { filter: none; opacity: 1; }
.badges { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.badge { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 18px; border: 2px solid var(--line); }
.badge .ico { font-size: 28px; }
.badge b { display: block; font-size: 14px; }
.badge span { font-size: 12px; color: var(--muted); line-height: 1.3; display: block; }
.badge.lock { opacity: .5; }
.badge.got { border-color: var(--sun); background: var(--warn-soft); }
.toggle { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; min-height: 48px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--coral); }
.toggle small { color: var(--muted); font-weight: 500; }
.points { margin: 8px 0 0; padding-left: 20px; }
.points li { margin: 4px 0; font-weight: 600; }
.passage { font-size: 22px; line-height: 1.7; font-weight: 700; }
.passage span { padding: 1px 2px; border-radius: 6px; }
.passage span.read { color: var(--muted); }
.passage span.cur { background: var(--sun); color: #231f3d; }
.xp-banner { display: flex; align-items: center; gap: 12px; background: var(--mint-soft); border-radius: 22px; padding: 14px 16px; margin: 12px 0; }
.xp-banner b { font-size: 28px; }
.xp-banner span { color: var(--muted); font-weight: 600; }
.alert { background: var(--warn-soft); color: var(--warn); border-radius: 16px; padding: 10px 14px; margin: 10px 0; font-weight: 700; }
.analysis p { margin: 8px 0; }
.analysis small { color: var(--muted); display: block; margin-top: 8px; }
.delta { font-weight: 800; }
.delta.up { color: var(--mint); }
.delta.down { color: var(--coral); }
.audio { width: 100%; margin-top: 8px; }
.rcount { color: var(--muted); font-weight: 700; margin: 0; }
.rapid-prompt { font-size: 24px; font-weight: 800; margin: 6px 0 0; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo"><span class="logo-dot">🎙️</span> Konuş</div>
    <div class="pill" id="streakPill" aria-live="polite"></div>
  </header>
  <main id="screen" aria-live="polite"></main>
  <p class="foot">Konuşman cihazından çıkmaz. Kayıt saklanmaz.</p>
</div>
<nav class="tabs" id="tabs" aria-label="Ana menü">
  <button data-tab="today" class="tab on"><span class="tab-ico">☀️</span><span>Bugün</span></button>
  <button data-tab="progress" class="tab"><span class="tab-ico">📈</span><span>İlerleme</span></button>
</nav>
<script>(function (root) {
  'use strict';

  var DEFAULT_EPOCH = new Date(2026, 10, 13);

  // Whole local calendar days since epoch. Uses UTC of local Y/M/D parts so DST never skews it.
  function dayIndex(date, epoch) {
    var e = epoch || DEFAULT_EPOCH;
    var a = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
    var b = Date.UTC(e.getFullYear(), e.getMonth(), e.getDate());
    return Math.round((a - b) / 86400000);
  }

  function pickDaily(list, date) {
    var n = list.length;
    return list[((dayIndex(date) % n) + n) % n];
  }

  function pickTest(types, last, rand) {
    var r = rand || Math.random;
    var pool = types.length > 1 ? types.filter(function (t) { return t !== last; }) : types;
    var i = Math.min(pool.length - 1, Math.floor(r() * pool.length));
    return pool[i];
  }

  function normalize(text) {
    return String(text || '')
      .toLowerCase()
      .replace(/[^a-z0-9'À-ɏ\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function countWords(text) {
    var n = normalize(text);
    return n ? n.split(' ').length : 0;
  }

  function targetHits(transcript, targets) {
    var padded = ' ' + normalize(transcript) + ' ';
    var hit = [];
    var missed = [];
    targets.forEach(function (t) {
      var needle = ' ' + normalize(t) + ' ';
      (padded.indexOf(needle) !== -1 ? hit : missed).push(t);
    });
    return { hit: hit, missed: missed };
  }

  function wordsPerMinute(wordCount, seconds) {
    if (!(seconds > 0)) return 0;
    return Math.round((wordCount / seconds) * 60);
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function dateKey(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  // Monday..Sunday keys of the local week containing `date`.
  function weekKeys(date) {
    var back = (date.getDay() + 6) % 7; // Monday = 0
    var keys = [];
    for (var i = 0; i < 7; i++) {
      keys.push(dateKey(new Date(date.getFullYear(), date.getMonth(), date.getDate() - back + i)));
    }
    return keys;
  }

  // csv of day keys; adds `key` once and keeps only the latest `keep` entries.
  function addDay(csv, key, keep) {
    var list = csv ? String(csv).split(',').filter(Boolean) : [];
    if (list.indexOf(key) === -1) list.push(key);
    var max = keep || 60;
    return list.slice(-max).join(',');
  }

  var api = {
    dateKey: dateKey,
    weekKeys: weekKeys,
    addDay: addDay,
    dayIndex: dayIndex,
    pickDaily: pickDaily,
    pickTest: pickTest,
    normalize: normalize,
    countWords: countWords,
    targetHits: targetHits,
    wordsPerMinute: wordsPerMinute
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.Logic = api;
})(typeof window !== 'undefined' ? window : globalThis);

;
(function (root) {
  'use strict';

  var PASSPORT_IDS = ['free', 'describe', 'opinion', 'story', 'targets', 'roleplay', 'repeat', 'rapid', 'shadow'];

  function parseKey(k) {
    var p = String(k).split('-');
    return Date.UTC(+p[0], +p[1] - 1, +p[2]);
  }
  // Whole calendar days from key a to key b ('YYYY-MM-DD').
  function daysBetween(a, b) {
    return Math.round((parseKey(b) - parseKey(a)) / 86400000);
  }

  // s = {last, streak, freeze}; returns the new state plus `used` (a freeze was spent).
  function nextStreak(s, key) {
    var last = s.last;
    var streak = s.streak || 0;
    var freeze = s.freeze || 0;
    var used = false;
    if (last === key) return { last: last, streak: streak, freeze: freeze, used: false };
    if (last) {
      var gap = daysBetween(last, key);
      if (gap < 0) return { last: last, streak: streak, freeze: freeze, used: false };
      if (gap === 1) streak += 1;
      else if (gap === 2 && freeze > 0) { streak += 1; freeze -= 1; used = true; }
      else streak = 1;
    } else {
      streak = 1;
    }
    if (streak % 7 === 0) freeze = Math.min(2, freeze + 1);
    return { last: key, streak: streak, freeze: freeze, used: used };
  }

  // The streak to display on day `key`.
  function streakAlive(s, key) {
    if (!s.last) return 0;
    var gap = daysBetween(s.last, key);
    if (gap <= 1) return s.streak || 0;
    if (gap === 2 && (s.freeze || 0) > 0) return s.streak || 0;
    return 0;
  }

  function xpFor(r) {
    if (!r || !(r.words > 0)) return 0;
    return 10 + Math.floor(Math.min(r.words, 120) / 6) + 2 * (r.hits || 0);
  }

  var RANKS = [
    { xp: 0, title: 'Sessiz' },
    { xp: 80, title: 'Mırıldanan' },
    { xp: 200, title: 'Sohbetçi' },
    { xp: 450, title: 'Konuşkan' },
    { xp: 800, title: 'Hatip' },
    { xp: 1500, title: 'Usta Hatip' }
  ];

  function rankFor(xp) {
    var idx = 0;
    for (var i = 0; i < RANKS.length; i++) if (xp >= RANKS[i].xp) idx = i;
    var cur = RANKS[idx];
    var next = RANKS[idx + 1] || null;
    var into = xp - cur.xp;
    return {
      title: cur.title,
      index: idx,
      next: next ? next.title : null,
      xpInto: into,
      xpNeeded: next ? next.xp - cur.xp : null,
      frac: next ? into / (next.xp - cur.xp) : 1
    };
  }

  var BADGES = [
    { id: 'first', title: 'İlk Söz', emoji: '🌱', desc: 'İlk testini bitir', test: function (s) { return s.done >= 1; } },
    { id: 'streak3', title: '3 Günlük Seri', emoji: '🔥', desc: '3 gün üst üste pratik yap', test: function (s) { return s.bestStreak >= 3; } },
    { id: 'streak7', title: 'Haftalık Seri', emoji: '🏅', desc: '7 gün üst üste pratik yap', test: function (s) { return s.bestStreak >= 7; } },
    { id: 'words100', title: '100 Kelime', emoji: '💬', desc: 'Toplam 100 kelime konuş', test: function (s) { return s.words >= 100; } },
    { id: 'words500', title: '500 Kelime', emoji: '🗣️', desc: 'Toplam 500 kelime konuş', test: function (s) { return s.words >= 500; } },
    { id: 'passport', title: 'Tam Pasaport', emoji: '🛂', desc: '9 günlük test türünün hepsini dene', test: function (s) {

    } },
    { id: 'ielts', title: 'IELTS Denemesi', emoji: '🎓', desc: 'Bir IELTS Speaking testi bitir', test: function (s) {

    { id: 'rapid', title: 'Hız Ustası', emoji: '⚡', desc: 'Bir hız turu bitir', test: function (s) { return s.stamps.indexOf('rapid') !== -1; } },
    { id: 'shadow', title: 'Gölge Okuyucu', emoji: '👥', desc: 'Bir gölgeleme testi bitir', test: function (s) { return s.stamps.indexOf('shadow') !== -1; } },
    { id: 'week', title: 'Haftanın Yıldızı', emoji: '⭐', desc: 'Bir haftalık görevi tamamla', test: function (s) { return s.weeksDone >= 1; } }
  ];

  function badgesFor(state) {
    return BADGES.map(function (b) {
      return { id: b.id, title: b.title, emoji: b.emoji, desc: b.desc, earned: !!b.test(state) };
    });
  }

  var CHALLENGES = [
    { id: 'types3', titleTr: '3 farklı test türünü dene', target: 3, metric: 'types' },
    { id: 'words150', titleTr: 'Bu hafta toplam 150 kelime konuş', target: 150, metric: 'words' },
    { id: 'days4', titleTr: '4 farklı günde pratik yap', target: 4, metric: 'days' },
    { id: 'rapid2', titleTr: 'Hız turunu 2 kez bitir', target: 2, metric: 'rapid' },
    { id: 'tests6', titleTr: 'Bu hafta 6 test bitir', target: 6, metric: 'tests' }
  ];
  var CHALLENGE_EPOCH = '2026-11-09'; // a Monday

  function challengeFor(weekKey) {

  function emptyWeek(key) {

  }

  }

    return '<svg class="ring" viewBox="0 0 90 90" role="img" aria-label="Günlük hedef ' + Math.min(n, goal) + '/' + goal + '">' +
      '<circle class="bg" cx="45" cy="45" r="' + r + '" fill="none" stroke-width="10"></circle>' +
      '<circle class="fg" cx="45" cy="45" r="' + r + '" fill="none" stroke-width="10" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - frac)).toFixed(1) + '" transform="rotate(-90 45 45)"></circle>' +
      '<text x="45" y="53" text-anchor="middle">' + Math.min(n, goal) + '/' + goal + '</text></svg>';
  }
  function rankHtml() {
    var xp = num('xp');
    var r = P.rankFor(xp);
    var hint = r.next ? 'Sonraki rütbe: ' + esc(r.next) + ' · ' + (r.xpNeeded - r.xpInto) + ' XP kaldı' : 'En yüksek rütbedesin 👑';
    return '<section class="card"><h2>Rütben</h2>' +
      '<div class="rankrow"><b>' + esc(r.title) + '</b><span>' + xp + ' XP</span></div>' +
      '<div class="bar slim gold"><i style="width:' + Math.round(r.frac * 100) + '%"></i></div>' +
      '<p class="hint" style="margin-top:8px">' + hint + '</p></section>';
  }
  function challengeHtml() {
    var wk = currentWeek();
    var ch = P.challengeFor(weekKey());
    var n = P.challengeProgress(ch, wk);
    var done = wk.claimed || n >= ch.target;
    return '<section class="card"><h2>Haftanın görevi</h2>' +
      '<p class="chal-title">' + esc(ch.titleTr) + '</p>' +
      '<div class="bar slim mint"><i style="width:' + Math.round((n / ch.target) * 100) + '%"></i></div>' +
      '<p class="hint" style="margin-top:8px">' + (done ? 'Tamamlandı ✓ (+50 XP)' : n + '/' + ch.target) + '</p></section>';
  }

  // ---------- cleanup ----------
  function discardAudio(r) {
    var a = r && r.audio;
    if (!a) return;
    a.state = 'cancelled';
    try { if (a.mr && a.mr.state !== 'inactive') { a.mr.onstop = null; a.mr.stop(); } } catch (e) {}
    try { if (a.stream) a.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
  }
  function stopAll() {
    if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
    if (run) {
      run.done = true;
      if (run.timer) clearInterval(run.timer);
      if (run.rec) { try { run.rec.onend = null; run.rec.abort(); } catch (e) {} }
      discardAudio(run);
      run = null;
    }
    if (synth) { try { synth.cancel(); } catch (e) {} }
    if (audioUrl) { try { URL.revokeObjectURL(audioUrl); } catch (e) {} audioUrl = null; }
  }
  function setTab(name) {
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab') === name);
    }
  }

    var hero = isI

    );

  function card() {
    stopAll();
    flow(true);
    var t = currentTest();
    var b = currentBuild();
    var pts = b.points ? '<ul class="points">' + b.points.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : '';
    var extra = b.prepSeconds ? ' · ' + b.prepSeconds + ' sn hazırlık' : '';
    show(
      '<p class="eyebrow">' + (mode === 'ielts' ? 'IELTS Speaking' : 'Bugünkü test') + '</p>' +
      '<h1>' + esc(t.titleTr) + '</h1>' +
      '<p class="meta">' + (mode === 'ielts' ? '' : LEVEL_TR[level] + ' · ') + b.seconds + ' sn' + extra + '</p>' +
      '<section class="card">' +
        '<p class="prompt">' + esc(b.promptEn) + '</p>' + pts +
        '<p class="hint" style="margin-top:10px">💡 ' + esc(b.hintTr) + '</p>' +
      '</section>' +
      (CAN_RECORD
        ? '<label class="toggle"><input type="checkbox" id="audioToggle"' + (store.get('audio') === '1' ? ' checked' : '') + '> <span>🎧 Sesimi kaydet ve geri dinle <small>(deneysel)</small></span></label>'
        : '') +
      '<button class="primary" id="start">Başla</button>' +
      '<div class="row"><button class="ghost" id="other">Başka test</button><button class="ghost" id="back">Geri</button></div>'
    );
    var at = $('audioToggle');
    if (at) at.addEventListener('change', function () { store.set('audio', at.checked ? '1' : '0'); });
    on('start', countdown);
    on('other', function () { pickNext(); card(); });
    on('back', home);
  }

  function countdown() {
    stopAll();
    flow(true);
    var n = 3;
    show('<div class="center"><p class="eyebrow">Hazır ol</p><div class="count" id="cnt">' + n + '</div></div>');
    cdTimer = setInterval(function () {
      n--;
      if (n <= 0) {
        clearInterval(cdTimer);
        cdTimer = null;
        var b = currentBuild();
        if (b.speakText) listen(b);
        else if (b.prepSeconds) prep(b);
        else record(b);
      } else {
        var el = $('cnt');
        if (el) el.textContent = n;
      }
    }, 1000);
  }

  function prep(b) {
    var started = Date.now();
    var went = false;
    var pts = (b.points || []).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('');
    show(
      '<p class="eyebrow">Hazırlık</p>' +
      '<div class="timer" id="ptime">' + mmss(b.prepSeconds) + '</div>' +
      '<section class="card"><p class="prompt">' + esc(b.promptEn) + '</p><p class="hint">You should say:</p><ul class="points">' + pts + '</ul></section>' +
      '<button class="primary" id="prepgo">Hazırım, konuşmaya başla</button>'
    );
    function go() {
      if (went) return;
      went = true;
      if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
      record(b);
    }
    on('prepgo', go);
    cdTimer = setInterval(function () {
      var left = b.prepSeconds - (Date.now() - started) / 1000;
      var el = $('ptime');
      if (el) el.textContent = mmss(left);
      if (left <= 0) go();
    }, 250);
  }

  function listen(b) {
    show(
      '<p class="eyebrow">Dinle</p>' +
      '<h1>Cümleyi dinle</h1>' +
      '<section class="card"><p class="prompt">' + esc(b.speakText) + '</p></section>' +
      '<div class="row"><button id="replay">🔊 Tekrar dinle</button></div>' +
      '<button class="primary" id="speak">Konuşmaya başla</button>'
    );
    function say() {
      if (!synth || !window.SpeechSynthesisUtterance) return;
      try {
        synth.cancel();
        var u = new window.SpeechSynthesisUtterance(b.speakText);
        u.lang = 'en-US';
        u.rate = 0.9;
        synth.speak(u);
      } catch (e) {}
    }
    on('replay', say);
    on('speak', function () { if (synth) { try { synth.cancel(); } catch (e) {} } record(b); });
    say();
  }

  function record(b) {
    run = {
      limit: b.seconds,
      startedAt: Date.now(),
      typed: !SR,
      base: '',
      final: '',
      interim: '',
      done: false,
      rec: null,
      timer: null,
      build: b,
      audio: null,
      ridx: -1,
      widx: -1,
      pspans: null
    };
    var body = SR
      ? '<div class="transcript" id="tr" aria-live="polite"><span class="ghost">Konuşmaya başla, söylediklerin burada yazılır…</span></div>'
      : '<textarea id="typed" placeholder="Cevabını İngilizce yaz…" aria-label="Cevabın"></textarea>';
    var top;
    if (b.prompts) {
      top = '<section class="card"><p class="rcount" id="rcount">1/' + b.prompts.length + '</p><p class="rapid-prompt" id="rprompt">' + esc(b.prompts[0]) + '</p></section>';
    } else if (b.passage) {
      top = '<section class="card"><p class="passage" id="passage">' +
        b.passage.split(/\s+/).map(function (w) { return '<span>' + esc(w) + '</span>'; }).join(' ') + '</p></section>';
    } else {
      var pts = b.points ? '<ul class="points">' + b.points.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : '';
      top = '<p class="hint" style="margin-top:12px">' + esc(b.promptEn) + '</p>' + pts;
    }
    show(
      '<p class="eyebrow">' + esc(currentTest().titleTr) + '</p>' +
      '<div class="timer" id="time">' + mmss(b.seconds) + '</div>' +
      '<div class="bar"><i id="fill"></i></div>' +
      top +
      '<div id="note"></div>' +
      '<div id="body">' + body + '</div>' +
      '<button class="primary" id="finish">Bitir</button>'
    );
    if (b.passage) run.pspans = screen.querySelectorAll('#passage span');
    on('finish', finish);
    if (SR) startRec();
    startAudio();
    run.timer = setInterval(tick, 250);
  }

  function startRec() {
    var rec;
    try { rec = new SR(); } catch (e) { switchToTyped(); return; }
    run.rec = rec;
    rec.lang = 'en-US';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = function (e) {
      var f = '';
      var i = '';
      for (var k = 0; k < e.results.length; k++) {
        var r = e.results[k];
        if (r.isFinal) f += r[0].transcript + ' '; else i += r[0].transcript;
      }
      if (run) { run.final = f; run.interim = i; paintTranscript(); }
    };
    rec.onerror = function (e) {
      if (!run) return;
      var code = e && e.error;
      if (code === 'not-allowed' || code === 'service-not-allowed' || code === 'audio-capture' || code === 'network') {
        switchToTyped(code);
      }
    };
    rec.onend = function () {
      if (!run || run.done || run.typed) return;
      run.base += run.final;
      run.final = '';
      run.interim = '';
      try { rec.start(); } catch (e) {}
    };
    try { rec.start(); } catch (e) { switchToTyped(); }
  }

  // Optional on-device audio capture for playback (never uploaded).
  function startAudio() {
    if (store.get('audio') !== '1' || !CAN_RECORD || !run) return;
    var r = run;
    r.audio = { chunks: [], mr: null, stream: null, state: 'pending' };
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      if (run !== r || r.done || r.typed || r.audio.state === 'cancelled') {
        stream.getTracks().forEach(function (t) { t.stop(); });
        return;
      }
      var mr;
      try { mr = new window.MediaRecorder(stream); }
      catch (e) { stream.getTracks().forEach(function (t) { t.stop(); }); r.audio.state = 'failed'; return; }
      r.audio.stream = stream;
      r.audio.mr = mr;
      r.audio.state = 'recording';
      mr.ondataavailable = function (ev) { if (ev.data && ev.data.size) r.audio.chunks.push(ev.data); };
      mr.start();
    }).catch(function () { r.audio.state = 'failed'; });
  }

  function stopAudio(r, cb) {
    var a = r.audio;
    if (!a || a.state !== 'recording' || !a.mr) { if (a) a.state = 'cancelled'; cb(null); return; }
    var finished = false;
    function done(blob) {
      if (finished) return;
      finished = true;
      try { a.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      cb(blob);
    }
    a.mr.onstop = function () {
      done(a.chunks.length ? new Blob(a.chunks, { type: a.mr.mimeType || 'audio/webm' }) : null);
    };
    try { a.mr.stop(); } catch (e) { done(null); }
    setTimeout(function () { done(null); }, 1500);
  }

  function liveText() {
    if (!run) return '';
    return (run.base + run.final + run.interim).trim();
  }

  function paintTranscript() {
    var el = $('tr');
    if (!el || !run) return;
    var t = liveText();
    el.textContent = t || 'Konuşmaya başla, söylediklerin burada yazılır…';
  }

  function switchToTyped(code) {
    if (!run || run.typed) return;
    var text = liveText();
    run.typed = true;
    if (run.rec) { try { run.rec.onend = null; run.rec.abort(); } catch (e) {} }
    discardAudio(run);
    var msg = code === 'not-allowed' || code === 'service-not-allowed'
      ? 'Mikrofon izni verilmedi. Cevabını yazarak verebilirsin.'
      : code === 'network'
        ? 'Konuşma tanıma için internet bağlantısı gerekiyor. Cevabını yazarak verebilirsin.'
        : 'Mikrofon kullanılamıyor. Cevabını yazarak verebilirsin.';
    var note = $('note');
    if (note) note.innerHTML = '<div class="notice">' + esc(msg) + '</div>';
    var body = $('body');
    if (body) {
      body.innerHTML = '<textarea id="typed" aria-label="Cevabın"></textarea>';
      var ta = $('typed');
      if (ta) ta.value = text;
    }
  }

  function tick() {
    if (!run || run.done) return;
    var elapsed = (Date.now() - run.startedAt) / 1000;
    var left = run.limit - elapsed;
    var t = $('time');
    var f = $('fill');
    if (t) t.textContent = mmss(left);
    if (f) f.style.width = Math.max(0, (left / run.limit) * 100) + '%';
    var b = run.build;
    if (b.prompts) {
      var ri = Math.min(b.prompts.length - 1, Math.floor(elapsed / b.roundSeconds));
      if (ri !== run.ridx) {
        run.ridx = ri;
        var rp = $('rprompt');
        var rc = $('rcount');
        if (rp) rp.textContent = b.prompts[ri];
        if (rc) rc.textContent = (ri + 1) + '/' + b.prompts.length;
      }
    }
    if (b.passage && run.pspans) {
      var wi = Math.floor(elapsed * b.passageWpm / 60);
      if (wi !== run.widx) {
        run.widx = wi;
        for (var k = 0; k < run.pspans.length; k++) {
          run.pspans[k].className = k < wi ? 'read' : (k === wi ? 'cur' : '');
        }
      }
    }
    if (left <= 0) finish();
  }

  function finish() {
    if (!run || run.done) return;
    var r = run;
    r.done = true;
    if (r.timer) clearInterval(r.timer);
    var text;
    if (r.typed) {
      var ta = $('typed');
      text = ta ? ta.value : '';
    } else {
      text = liveText();
    }
    if (r.rec) { try { r.rec.onend = null; r.rec.abort(); } catch (e) {} }
    if (synth) { try { synth.cancel(); } catch (e) {} }
    var seconds = Math.min(r.limit, (Date.now() - r.startedAt) / 1000);
    run = null;
    stopAudio(r, function (blob) { finalize(r, text.trim(), seconds, blob); });
  }

  function finalize(r, text, seconds, blob) {
    var words = L.countWords(text);
    var an = A.analyze(text);
    var hits = r.build.targets ? L.targetHits(text, r.build.targets) : null;
    var wpm = r.typed ? null : L.wordsPerMinute(words, seconds);
    var cur = { words: words, wpm: wpm, unique: an.unique };
    var prev = getJSON('prev_' + testId);
    var cmp = words > 0 ? A.compare(prev, cur) : null;
    var info = commit({ words: words, hitCount: hits ? hits.hit.length : 0 });
    if (words > 0) setJSON('prev_' + testId, cur);
    if (blob) { try { audioUrl = URL.createObjectURL(blob); } catch (e) { audioUrl = null; } }
    result({
      text: text, seconds: seconds, words: words, wpm: wpm, typed: r.typed, hits: hits,
      an: an, cmp: cmp, hadPrev: !!prev, info: info, audioUrl: audioUrl,
      cov: r.build.passage ? A.coverage(text, r.build.passage) : null,
      title: currentTest().titleTr
    });
  }

  // ---------- share card ----------
  function siteUrl() { return window.location.href.split(/[?#]/)[0]; }
  function shareText(s) {
    return 'Bugün İngilizce konuşma pratiğinde ' + s.words + ' kelime konuştum 🎙️ Serim: ' +
      P.streakAlive(getStreak(), L.dateKey(new Date())) + ' gün. Sen de dene: ' + siteUrl();
  }
  function rrect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function drawCard(s) {
    var c = document.createElement('canvas');
    c.width = 1080;
    c.height = 1350;
    var g = c.getContext('2d');
    var bg = g.createLinearGradient(0, 0, 1080, 1350);
    bg.addColorStop(0, '#6d4cc9');
    bg.addColorStop(1, '#3b3fa8');
    g.fillStyle = bg;
    g.fillRect(0, 0, 1080, 1350);
    g.fillStyle = '#ff6b57';
    g.beginPath();
    g.arc(980, 100, 220, 0, Math.PI * 2);
    g.fill();
    var font = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    g.fillStyle = '#ffffff';
    g.font = '800 64px ' + font;
    g.fillText('🎙️ Konuş', 80, 150);
    g.font = '600 40px ' + font;
    g.fillStyle = '#e4e1ff';
    g.fillText('İngilizce Speaking Pratik', 80, 215);
    g.fillStyle = '#ffffff';
    g.font = '800 300px ' + font;
    g.fillText(String(s.words), 70, 640);
    g.font = '700 70px ' + font;
    g.fillText('kelime konuştum', 80, 735);
    var streak = P.streakAlive(getStreak(), L.dateKey(new Date()));
    var items = [
      [s.wpm == null ? '–' : String(s.wpm), 'kelime/dk'],
      ['🔥 ' + streak, 'gün seri'],
      [P.rankFor(num('xp')).title, 'rütbe']
    ];
    items.forEach(function (it, i) {
      var x = 80 + i * 300;
      g.fillStyle = 'rgba(255,255,255,0.16)';
      rrect(g, x, 820, 280, 190, 36);
      g.fill();
      g.fillStyle = '#ffffff';
      g.font = '800 54px ' + font;
      g.fillText(it[0], x + 24, 905);
      g.font = '600 32px ' + font;
      g.fillStyle = '#e4e1ff';
      g.fillText(it[1], x + 24, 965);
    });
    g.fillStyle = '#ffffff';
    g.font = '700 46px ' + font;
    g.fillText(s.title, 80, 1120);
    g.font = '500 36px ' + font;
    g.fillStyle = '#e4e1ff';
    g.fillText(siteUrl().replace(/^https?:\/\//, ''), 80, 1260);
    return c;
  }
  function cardBlob(s, cb) {
    try { drawCard(s).toBlob(function (b) { cb(b); }, 'image/png'); } catch (e) { cb(null); }
  }
  function note(msg) { var el = $('shareNote'); if (el) el.textContent = msg; }

  function wireShare(s) {
    on('copy', function () {
      var t = shareText(s);
      try {
        navigator.clipboard.writeText(t).then(function () { note('Metin kopyalandı ✓'); }, function () { note('Kopyalanamadı. Metni elle seçip kopyalayabilirsin: ' + t); });
      } catch (e) { note('Kopyalanamadı. Metni elle seçip kopyalayabilirsin: ' + t); }
    });
    on('dl', function () {
      cardBlob(s, function (blob) {
        if (!blob) { note('Resim oluşturulamadı.'); return; }
        try {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'konus-sonuc.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
          note('Resim indirildi ✓');
        } catch (e) { note('Bu ortamda indirme çalışmıyor. Metni kopyalamayı dene.'); }
      });
    });
    on('share', function () {
      cardBlob(s, function (blob) {
        try {
          if (blob && navigator.canShare && window.File) {
            var f = new File([blob], 'konus-sonuc.png', { type: 'image/png' });
            if (navigator.canShare({ files: [f] })) { navigator.share({ files: [f], text: shareText(s) }).catch(function () {}); return; }
          }
          if (navigator.share) { navigator.share({ text: shareText(s) }).catch(function () {}); return; }
        } catch (e) {}
        note('Bu tarayıcı paylaşımı desteklemiyor. Resmi indirebilir veya metni kopyalayabilirsin.');
      });
    });
  }

  function confetti() {
    var wrap = document.createElement('div');
    wrap.className = 'confetti';
    wrap.setAttribute('aria-hidden', 'true');
    var bits = ['🎉', '⭐', '✨', '🟠', '🟣', '🟡'];
    for (var i = 0; i < 16; i++) {
      var sp = document.createElement('span');
      sp.textContent = bits[i % bits.length];
      sp.style.left = (Math.random() * 96) + '%';
      sp.style.animationDelay = (Math.random() * 0.8) + 's';
      wrap.appendChild(sp);
    }
    document.body.appendChild(wrap);
    setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 4000);
  }

  // ---------- result ----------
  function analysisHtml(s) {
    var an = s.an;
    var f = an.fillers;
    var foundTxt = Object.keys(f.found).map(function (k) { return esc(k) + ' ×' + f.found[k]; }).join(', ');
    var pace = !s.typed && s.words >= 10 ? A.paceLabel(s.wpm) : null;
    var rep = an.repeated.map(function (x) { return esc(x.word) + ' ×' + x.n; }).join(', ');
    return '<section class="card analysis"><h2>Konuşma analizi</h2>' +
      '<p>🔤 <b>Farklı kelime:</b> ' + an.unique + ' / ' + an.words + ' (%' + an.ratio + ')</p>' +
      '<p>🧩 <b>Dolgu ifadeler:</b> ' + (f.count ? f.count + ' (' + foundTxt + ')' : 'Yok 👏') + '</p>' +
      (rep ? '<p>🔁 <b>Sık tekrar eden:</b> ' + rep + '</p>' : '') +
      (pace ? '<p>⏱️ <b>Tempo:</b> ' + pace + ' (' + s.wpm + ' kelime/dk)</p>' : '') +
      (s.cov != null ? '<p>🎯 <b>Okuma doğruluğu:</b> %' + s.cov + '</p>' : '') +
      '<small>Konuşma tanıma "um", "uh" gibi sesleri bazen yazıya dökmez; sonuçlar yaklaşıktır.</small></section>';
  }
  function compareHtml(s) {
    if (!s.cmp) {
      return '<section class="card"><h2>Geçen denemeyle kıyas</h2><p class="empty">İlk denemen! Aynı testi bir daha yaptığında burada farkı göreceksin.</p></section>';
    }
    var c = s.cmp;
    var chips = '<span class="chip"><span class="delta ' + cls(c.words) + '">' + sign(c.words) + '</span> kelime</span>' +
      '<span class="chip"><span class="delta ' + cls(c.unique) + '">' + sign(c.unique) + '</span> farklı kelime</span>';
    if (c.wpm !== null) chips += '<span class="chip"><span class="delta ' + cls(c.wpm) + '">' + sign(c.wpm) + '</span> kelime/dk</span>';
    return '<section class="card"><h2>Geçen denemeyle kıyas</h2><div class="chips">' + chips + '</div></section>';
  }
  function rewardsHtml(s) {
    var i = s.info;
    var h = '<div class="xp-banner"><b>+' + (i.xp + i.bonus) + ' XP</b><span>' + esc(P.rankFor(num('xp')).title) + ' · ' + num('xp') + ' XP</span></div>';
    if (i.rankUp) h += '<div class="alert">🎖️ Yeni rütbe: ' + esc(i.rankUp) + '</div>';
    i.newBadges.forEach(function (b) { h += '<div class="alert">' + b.emoji + ' Yeni rozet: ' + esc(b.title) + '</div>'; });
    if (i.challenge) h += '<div class="alert">⭐ Haftalık görev tamamlandı: ' + esc(i.challenge.titleTr) + ' (+50 XP)</div>';
    if (i.usedFreeze) h += '<div class="alert">❄️ Bir günü kaçırdın ama seri dondurma hakkın seriyi korudu.</div>';
    return h;
  }

  function result(s) {
    flow(true);
    paintPill();
    var hitsHtml = '';
    if (s.hits) {
      hitsHtml = '<section class="card"><h2>Hedef kelimeler (' + s.hits.hit.length + '/' + (s.hits.hit.length + s.hits.missed.length) + ')</h2><div class="chips">' +
        s.hits.hit.map(function (w) { return '<span class="chip hit">✓ ' + esc(w) + '</span>'; }).join('') +
        s.hits.missed.map(function (w) { return '<span class="chip miss">✗ ' + esc(w) + '</span>'; }).join('') +
        '</div></section>';
    }
    var body;
    if (s.words === 0) {
      body =
        '<section class="card"><p class="empty">Hiç konuşma algılanmadı. Mikrofona biraz yaklaşıp tekrar dene; istersen cevabını yazarak da verebilirsin.</p></section>';
    } else {
      body =
        rewardsHtml(s) +
        '<div class="result-grid">' +
          '<div class="stat"><b>' + Math.round(s.seconds) + '</b><span>saniye</span></div>' +
          '<div class="stat"><b>' + s.words + '</b><span>kelime</span></div>' +
          '<div class="stat"><b>' + (s.wpm === null ? '–' : s.wpm) + '</b><span>kelime/dk</span></div>' +
        '</div>' +
        analysisHtml(s) +
        compareHtml(s) +
        hitsHtml +
        '<section class="card"><h2>' + (s.typed ? 'Yazdığın' : 'Duyduğumuz') + '</h2><p>' + esc(s.text) + '</p>' +
          (s.audioUrl ? '<audio class="audio" id="replayAudio" controls src="' + esc(s.audioUrl) + '"></audio>' : '') +
        '</section>' +
        '<section class="card"><h2>Paylaş</h2>' +
          '<div class="row" style="margin-top:0"><button id="share">📤 Paylaş</button><button id="dl">🖼️ Resmi indir</button></div>' +
          '<div class="row"><button class="ghost" id="copy">📋 Metni kopyala</button></div>' +
          '<p class="hint" id="shareNote" style="margin-top:8px"></p></section>';
    }
    show(
      '<p class="eyebrow">Sonuç · ' + esc(s.title) + '</p>' +
      '<h1>' + (s.words === 0 ? 'Bu sefer olmadı' : 'Aferin, bitirdin!') + '</h1>' +
      body +
      '<button class="primary" id="again">Tekrar dene</button>' +
      '<div class="row"><button id="next">Başka test</button><button class="ghost" id="home">Ana sayfa</button></div>'
    );
    if (s.words > 0) { confetti(); wireShare(s); }
    on('again', card);
    on('next', function () { pickNext(); card(); });
    on('home', home);
  }

  // ---------- tabs ----------
  var tabBtns = document.querySelectorAll('.tab');
  for (var ti = 0; ti < tabBtns.length; ti++) {
    tabBtns[ti].addEventListener('click', function (e) {
      var name = e.currentTarget.getAttribute('data-tab');
      if (name === 'progress') progress(); else home();
    });
  }

  home();
})();
</script>
</body>
</html>
