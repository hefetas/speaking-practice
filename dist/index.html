<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="light dark">
<title>İngilizce Speaking Pratik</title>
<style>:root {
  --bg: #f6f5f1;
  --card: #ffffff;
  --ink: #1d2327;
  --muted: #5d676d;
  --line: #e2e0d8;
  --accent: #1f6f5c;
  --accent-ink: #ffffff;
  --accent-soft: #dff0ea;
  --warn: #8a4b00;
  --warn-soft: #fff1dc;
  --bad: #a32d2d;
  --good: #1f6f5c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181a;
    --card: #1e2427;
    --ink: #eef1f2;
    --muted: #a3aeb3;
    --line: #2f383c;
    --accent: #4fc3a1;
    --accent-ink: #0c1f19;
    --accent-soft: #1d3a31;
    --warn: #f2b868;
    --warn-soft: #3a2c14;
    --bad: #ff8a8a;
    --good: #4fc3a1;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
}
#app { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
.brand { font-weight: 700; padding: 8px 0 12px; letter-spacing: .2px; }
.foot { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; }
h1 { font-size: 26px; line-height: 1.2; margin: 4px 0 2px; }
h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.eyebrow { color: var(--muted); font-size: 14px; margin: 0; }
.sub { color: var(--muted); margin: 0 0 16px; }
.big { font-size: 30px; vertical-align: -3px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 15px; }
.chip.hit { background: var(--accent-soft); }
.chip.miss { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
button {
  font: inherit;
  min-height: 48px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  padding: 10px 16px;
  cursor: pointer;
}
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary { width: 100%; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; font-size: 17px; margin-top: 8px; }
button.ghost { background: transparent; }
.row { display: flex; gap: 8px; margin-top: 8px; }
.row > button { flex: 1; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
.stat b { display: block; font-size: 24px; }
.stat span { color: var(--muted); font-size: 13px; }
.prompt { font-size: 21px; line-height: 1.35; margin: 4px 0 12px; font-weight: 600; }
.hint { color: var(--muted); margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 15px; }
.center { text-align: center; padding: 48px 0; }
.count { font-size: 96px; font-weight: 800; color: var(--accent); }
.timer { font-size: 44px; font-weight: 800; text-align: center; margin: 4px 0; font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .25s linear; }
.transcript, textarea {
  width: 100%;
  min-height: 150px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  font: inherit;
  color: var(--ink);
  margin-top: 12px;
}
.transcript { white-space: pre-wrap; }
.transcript .ghost { color: var(--muted); }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.empty { color: var(--muted); }
@media (max-width: 380px) {
  h1 { font-size: 23px; }
  .prompt { font-size: 19px; }
}
</style>
</head>

  // Whole local calendar days since epoch. Uses UTC of local Y/M/D parts so DST never skews it.
  function dayIndex(date, epoch) {
    var e = epoch || DEFAULT_EPOCH;
    var a = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
    var b = Date.UTC(e.getFullYear(), e.getMonth(), e.getDate());
    return Math.round((a - b) / 86400000);
  }

  function pickDaily(list, date) {
    var n = list.length;
    return list[((dayIndex(date) % n) + n) % n];
  }

  function pickTest(types, last, rand) {
    var r = rand || Math.random;
    var pool = types.length > 1 ? types.filter(function (t) { return t !== last; }) : types;
    var i = Math.min(pool.length - 1, Math.floor(r() * pool.length));
    return pool[i];
  }

    return String(text || '')
      .toLowerCase()
      .replace(/[^a-z0-9'À-ɏ\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function countWords(text) {
    var n = normalize(text);
    return n ? n.split(' ').length : 0;
  }

    var padded = ' ' + normalize(transcript) + ' ';
    var hit = [];
    var missed = [];
    targets.forEach(function (t) {

    return { hit: hit, missed: missed };
  }

    return Math.round((wordCount / seconds) * 60);
